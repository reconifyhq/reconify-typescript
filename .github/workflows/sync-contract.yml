name: Sync public OpenAPI contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run sync-contract
      - run: npm run verify
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/openapi-contract-sync
          delete-branch: true
          commit-message: "chore: sync public OpenAPI contract"
          title: "chore: sync public OpenAPI contract"
          body: |
            This automated update was generated from the public Reconify OpenAPI
            manifest. Review generated APIs, examples, and migration notes before merging.
